    <script>
      // Shim window.fetch with both getter and setter so that scripts or sandboxes attempting
      // to patch window.fetch do not throw 'Cannot set property fetch of #<Window> which has only a getter'
      (function () {
        try {
          if (typeof window !== 'undefined') {
            window.addEventListener(
              'error',
              function (event) {
                if (
                  event &&
                  event.message &&
                  typeof event.message === 'string' &&
                  event.message.indexOf('fetch') !== -1 &&
                  event.message.indexOf('getter') !== -1
                ) {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  return true;
                }
              },
              true
            );

            var initialFetch = window.fetch;
            var activeFetch = initialFetch;

            try {
              Object.defineProperty(window, 'fetch', {
                get: function () {
                  return activeFetch;
                },
                set: function (fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (errWindow) {
              try {
                var proto = Window.prototype || Object.getPrototypeOf(window);
                if (proto) {
                  var protoFetch = proto.fetch || initialFetch;
                  Object.defineProperty(proto, 'fetch', {
                    get: function () {
                      return protoFetch;
                    },
                    set: function (fn) {
                      protoFetch = fn;
                      activeFetch = fn;
                    },
                    configurable: true,
                    enumerable: true,
                  });
                }
              } catch (errProto) {}
            }
          }
        } catch (globalErr) {}
      })();
    </script>
